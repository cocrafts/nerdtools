git:
  overrideGpg: true
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never --hyperlinks --line-numbers --wrap-max-lines=0 --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - colorArg: always
      pager: diff-so-fancy --color=always
    - colorArg: always
      externalDiffCommand: difft --color=always
gui:
  sidePanelWidth: 0.2
  border: 'rounded'
  wrapLinesInStagingView: false
  showSummaryOnCommit: true
  showBottomLine: false
  showCommandLog: false # use @ key to toggle it on
  showListFooter: false # for seeing the '5 of 20' message in list panels
  showRootItemInFileTree: false
  nerdFontsVersion: "" # nerd fonts version to use ("2" or "3"); empty means don't show nerd font icons
  os:
    editPreset: 'nvim'
  theme:
    activeBorderColor:
      - '#98be65'
      - bold
    inactiveBorderColor:
      - '#45475a'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    selectedRangeBgColor:
      - '#313244'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#a6e3a1'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    searchingActiveBorderColor:
      - '#f9e2af'
