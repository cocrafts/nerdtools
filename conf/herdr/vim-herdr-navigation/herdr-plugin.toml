id = "vim-herdr-navigation"
name = "Vim Herdr Navigation"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Seamless Ctrl+h/j/k/l navigation and Ctrl+w pane close across herdr panes and Vim/Neovim splits"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "left"
title = "Navigate left (Vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "left"]

[[actions]]
id = "down"
title = "Navigate down (Vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "down"]

[[actions]]
id = "up"
title = "Navigate up (Vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "up"]

[[actions]]
id = "right"
title = "Navigate right (Vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "right"]

[[actions]]
id = "close"
title = "Close pane (Vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "close"]
