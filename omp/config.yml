enabledProviders:
  - claude
memory:
  backend: "off"
providers:
  webSearchOrder:
    - zai
    - parallel
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - synthetic
    - ollama
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
modelRoles:
  default: zai/glm-5.3:high
symbolPreset: nerd
hideThinkingBlock: true
composer:
  shape: pi
  tokenRate: true
theme:
  dark: saigon-night
setupVersion: 2
tui:
  textSizing: true
  codexResetFireworks: true
  hyperlinks: always
  tight: false
terminal:
  showProgress: false
display:
  hideToolActivity: true
  cacheMissMarker: true
statusLine:
  compactThinkingLevel: true
  transparent: false
  sessionAccent: true
  contextLine: embedded
  preset: custom
  leftSegments:
    - pi
    - git
    - model
    - mode
  rightSegments:
    - cache_hit
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true